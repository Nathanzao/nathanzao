<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banner do Perfil GitHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
    <style>
        /* Estilos para fontes personalizadas */
        .font-press-start {
            font-family: 'Press Start 2P', cursive;
        }
        .font-vt323 {
            font-family: 'VT323', monospace;
        }
        /* Efeito de brilho para o texto */
        .text-glow {
            text-shadow: 0 0 5px #00aaff, 0 0 10px #00aaff, 0 0 15px #00aaff;
        }
    </style>
</head>
<body class="bg-gray-900 flex items-center justify-center min-h-screen p-4">

    <!-- Container do Banner -->
    <div class="w-full max-w-4xl bg-black/50 backdrop-blur-sm border-2 border-cyan-400 rounded-2xl shadow-[0_0_15px_rgba(0,255,255,0.4)] overflow-hidden">
        <div class="flex flex-col md:flex-row items-stretch">

            <!-- Lado Esquerdo: Imagens (Gatos + GIF) -->
            <div class="w-full md:w-1/2 relative">
                <!-- Imagem principal dos Gatos -->
                <!-- IMPORTANTE: Substitua o 'src' abaixo pela URL da sua imagem. -->
                <!-- Você pode fazer upload da sua imagem em um site como https://imgur.com/ para obter uma URL. -->
                <img src="https://cdn.discordapp.com/attachments/1381547093214367807/1381552843374334052/IMG_20250523_115419.jpg?ex=6847eed9&is=68469d59&hm=b239e509893a353b88efc17e6ec707261e405373fcc92e117e6e4f8e3ffc8e76&" 
                     onerror="this.onerror=null; this.src='https://placehold.co/600x400/101010/FFFFFF?text=Imagem+Nao+Encontrada';" 
                     alt="Dois gatos relaxando em um muro à noite" 
                     class="w-full h-full object-cover">
                
                <!-- Overlay com o GIF -->
                <div class="absolute inset-0 bg-black/40">
                    <img src="https://media.giphy.com/media/AOSwwqVjNZlDO/giphy.gif" 
                         alt="Animação de código caindo no estilo Matrix" 
                         class="w-full h-full object-cover opacity-20">
                </div>
            </div>

            <!-- Lado Direito: Textos e Informações -->
            <div class="w-full md:w-1/2 p-6 flex flex-col justify-center bg-gray-900/30">
                
                <!-- Nome/Usuário -->
                <h1 class="font-press-start text-2xl lg:text-3xl text-cyan-300 text-glow">
                    <!-- Altere para seu nome ou usuário -->
                    Nathanzao
                </h1>

                <!-- Subtítulo / Cargo -->
                <p class="font-vt323 text-xl lg:text-2xl text-white mt-2">
                    // Estudante &nbsp;<span class="animate-ping">_</span>
                </p>

                <!-- Seção de status ou mensagem -->
                <div class="mt-6 font-vt323 text-lg text-green-400 border-l-4 border-green-400 pl-4">
                    <p class="font-bold">> Status: Aprendendo agora mesmo.</p>
                </div>

                <!-- Ícones de Redes Sociais -->
                <div class="mt-8 flex space-x-4">
                    <!-- Altere os links (href) para seus perfis -->
                    <a href="#" class="text-gray-400 hover:text-cyan-300 transition-colors duration-300">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.477 2 12.013c0 4.418 2.865 8.167 6.839 9.49.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.03-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.378.203 2.398.1 2.65.64.7 1.028 1.595 1.028 2.688 0 3.848-2.338 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.745 0 .267.18.577.688.48A10.001 10.001 0 0022 12.013C22 6.477 17.523 2 12 2z" clip-rule="evenodd" /></svg>
                    </a>
                    <a href="#" class="text-gray-400 hover:text-cyan-300 transition-colors duration-300">
                        <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.25 2H2.75C2.336 2 2 2.336 2 2.75v18.5c0 .414.336.75.75.75h18.5c.414 0 .75-.336.75-.75V2.75c0-.414-.336-.75-.75-.75zM8.29 18.995H5.4V9.872h2.89v9.123zM6.845 8.657a1.85 1.85 0 110-3.7 1.85 1.85 0 010 3.7zM18.998 19H16.12v-4.37c0-1.04-.02-2.38-1.45-2.38-1.45 0-1.67.9-1.67 2.3v4.45h-2.88V9.872h2.76v1.27h.04c.38-.72 1.32-1.47 2.72-1.47 2.9 0 3.44 1.91 3.44 4.4v5.12z" /></svg>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
